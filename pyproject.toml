[project]
name = "costco-purchase-analyzer"
version = "0.1.0"
description = "AI-powered Costco receipt scanner and price match tool"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "mangum>=0.19.0",
    "boto3>=1.38.0",
    "strands-agents>=0.1.7",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "pillow>=11.0.0",
    "pymupdf>=1.25.0",
    "playwright>=1.49.0",
    "python-multipart>=0.0.12",
    "markdown2>=2.5.0",
]

[dependency-groups]
dev = [
    "aws-cdk-lib>=2.200.0",
    "constructs>=10.4.2",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false
